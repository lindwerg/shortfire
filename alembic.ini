# Alembic configuration for shortfire — D-26
# sqlalchemy.url is intentionally empty; env.py reads DATABASE_URL from the environment.
# SECURITY (T-00-01): credentials are never stored in this file.

[alembic]
script_location = alembic

# src added so that `from shortfire.db...` imports resolve when alembic runs from project root
prepend_sys_path = . src

# Database URL — intentionally empty. env.py reads DATABASE_URL env var and rewrites it.
# DO NOT set this to a real URL with credentials.
sqlalchemy.url =

# Posix path separator — fine for Railway/Linux (D-26)
path_separator = os


[post_write_hooks]
# Format generated revision scripts with ruff
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


# Logging configuration — alembic at INFO; sqlalchemy.engine at WARNING (no SQL spam in tests)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

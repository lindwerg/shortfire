"$schema" = "https://railway.com/railway.schema.json"

# railway.dashboard.toml — config-as-code override for the dashboard service (D-03).
#
# Shares the same Dockerfile (and resulting image) as data-platform and strategy-engine;
# only startCommand and sleep behaviour differ per D-03 / D-04.
#
# In Railway dashboard: Service → Settings → Config-as-Code → Railway Config File
# Set to: railway.dashboard.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn shortfire.entrypoints.dashboard:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
sleepApplication = true   # D-04: dashboard sleeps when idle in Phase 0

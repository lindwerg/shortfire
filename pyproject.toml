[project]
name = "shortfire"
version = "0.1.0"
description = "MEXC Futures Sniper — crypto data platform + short-after-pump strategy"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.11",
    "fastapi>=0.128",
    "uvicorn[standard]>=0.39",
    "structlog>=25.5",
    "asgi-correlation-id>=4.3",
    "prometheus-client>=0.25",
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31",
    "alembic>=1.16",
    "orjson>=3.11",
    "tenacity>=9.1",
    "aiolimiter>=1.2",
    "httpx>=0.28",
    "python-dotenv>=1.2",
    "greenlet>=3.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.1",
    "hypothesis>=6.141",
    "freezegun>=1.5",
    "respx>=0.23",
    "aioresponses>=0.7",
    "testcontainers[postgres]>=4.13",
    "ruff>=0.15",
    "pyright>=1.1.409",
    "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortfire"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker + testcontainers (slow)",
]
addopts = [
    "-ra",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "PERF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
reportMissingTypeStubs = "warning"

# Tests use untyped third-party fixtures (Hypothesis strategies, freezegun, tomllib output, etc.)
# that pyright cannot infer through. We keep `strict` for src/ but drop tests/ to `basic`
# typeCheckingMode + silence the few false positives unique to test-folder import resolution.
# Strict checking inside test bodies is the wrong forcing function.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportMissingImports = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportArgumentType = "none"
reportReturnType = "none"

[tool.coverage.run]
source = ["src/shortfire"]
branch = true
omit = [
    "src/shortfire/risk/*",
    "src/shortfire/execution/*",
    "src/shortfire/strategy/*",
]

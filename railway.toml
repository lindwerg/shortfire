"$schema" = "https://railway.com/railway.schema.json"

# railway.toml — static config-as-code for the data-platform service (D-03).
#
# All 3 Railway app services (data-platform, strategy-engine, dashboard) share
# one Docker image (this Dockerfile). Per-service start commands + sleep
# behaviour live in dedicated config files:
#   - data-platform   → this file
#   - strategy-engine → railway.strategy-engine.toml
#   - dashboard       → railway.dashboard.toml
# Set the "Railway Config File" path in each service's Settings → Config-as-Code.
#
# References: RESEARCH.md §Pattern 4, CONTEXT.md D-03, D-04, D-05, D-34
#             RESEARCH.md Open Question 1 (preDeployCommand recommendation)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# D-05: no watchPatterns in Phase 0 — every commit to main triggers a redeploy
# of all 3 services. Revisit only if Railway build cost or instability becomes
# an issue in Phase 1+.

[deploy]
# ── data-platform defaults ────────────────────────────────────────────────────
# strategy-engine and dashboard have their own *.toml files (see header).
#
# ── Environment variables for ALL 3 app services (Railway dashboard → Variables) ──
#   DATABASE_URL = ${{ Timescale.DATABASE_URL }}    (D-24 reference variable)
#   ENV          = production
#   LOG_LEVEL    = INFO
#
# ── preDeployCommand (data-platform only) ─────────────────────────────────────
# RESEARCH.md Open Question 1 recommendation: run migrations in preDeployCommand
# (not startCommand) so Railway waits for migrations to succeed before routing
# traffic. Idempotent — safe to run on every deploy (D-31, alembic upgrade head).
# strategy-engine and dashboard intentionally do not set preDeployCommand —
# only one service runs migrations.
# Runtime image has no uv — use the bare alembic binary from /app/.venv/bin
# (already on PATH via base ENV PATH="/app/.venv/bin:$PATH").
preDeployCommand = ["alembic upgrade head"]

# Railway does NOT shell-expand $PORT in startCommand strings — must wrap in `sh -c`.
# Without sh -c, uvicorn receives the literal '$PORT' and dies on `Error: Invalid value for '--port': '$PORT' is not a valid integer`.
startCommand = "sh -c 'uvicorn shortfire.entrypoints.data_platform:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# sleepApplication NOT set here — data-platform is always-on (D-04).
# Railway default when the key is absent = false (always-on).
